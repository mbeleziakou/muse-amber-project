name: Ostrovok
options:
  bundleIdPrefix: com.vagab
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.3.0
targets:
  Ostrovok:
    type: application
    platform: macOS
    sources:
      - Ostrovok
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Ostrovok/Resources/Info.plist
      properties:
        CFBundleName: Ostrovok
        CFBundleDisplayName: Ostrovok
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Shows today's meetings and starts focus until the next one.
        NSCalendarsUsageDescription: Shows today's meetings.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vagab.ostrovok
        PRODUCT_NAME: Ostrovok
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Ostrovok/Resources/Ostrovok.entitlements
  OstrovokTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OstrovokTests
    dependencies:
      - target: Ostrovok
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ostrovok.app/Contents/MacOS/Ostrovok
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ostrovok:
    build:
      targets:
        Ostrovok: all
        OstrovokTests: [test]
    test:
      targets:
        - OstrovokTests
